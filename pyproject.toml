[project]
name = "education-admin-rag"
version = "0.1.0"
description = "Offline PDF corpus and RAG foundation for education administration."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic",
    "pymupdf",
    "qdrant-client",
    "sentence-transformers",
    "typer",
]

[project.optional-dependencies]
ocr = [
    "paddleocr; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "paddlepaddle; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "jsonschema",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
