[project]
name = "seoul-education-travel-map"
version = "0.1.0"
description = "서울교육기관 관내출장 지도"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "pydantic-settings>=2.15.0",
    "pyproj>=3.7.2",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.2",
]
