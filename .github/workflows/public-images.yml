name: public-images

on:
  workflow_dispatch:
    inputs:
      image:
        description: Public image set to build
        required: true
        default: all
        type: choice
        options:
          - all
          - ingestion
          - indexer

permissions:
  contents: read
  packages: write

concurrency:
  group: public-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingestion:
    if: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == 'ingestion' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and publish ingestion image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/education-admin-rag-ingestion:${GITHUB_SHA}"
          docker buildx create --use --driver docker-container
          docker buildx build \
            --platform linux/amd64 \
            --network default \
            --provenance=mode=max \
            --sbom=true \
            --push \
            -f docker/ingestion.Dockerfile \
            -t "$image" \
            .

  indexer:
    if: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == 'indexer' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and publish indexer image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/education-admin-rag-indexer:${GITHUB_SHA}"
          docker buildx create --use --driver docker-container
          docker buildx build \
            --platform linux/amd64 \
            --network default \
            --provenance=mode=max \
            --sbom=true \
            --push \
            -f docker/indexer.Dockerfile \
            -t "$image" \
            .
