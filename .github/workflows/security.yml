name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.11.17"
      - name: Scan current tree and full history
        run: bash scripts/scan-secrets.sh
      - name: Run security regression tests
        run: uv run pytest tests/security -q
