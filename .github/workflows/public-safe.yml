name: public-safe

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-safe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned uv
        run: >-
          python -m pip install --no-cache-dir --require-hashes
          "uv @ https://files.pythonhosted.org/packages/0e/51/b75808766f895248553c6370968509cd4f726e6943e310a8f7a171036ad0/uv-0.11.17-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=9da839e5a491c9a701d7d327a199cafc76ac27a03ac84fd2a8d4bf32c3af2448"
      - name: Public repository boundary
        run: ./scripts/ci-public-gates.sh policy
      - name: Quality
        run: ./scripts/ci-public-gates.sh quality
      - name: Security
        run: ./scripts/ci-public-gates.sh security
      - name: Documentation contracts
        run: ./scripts/ci-public-gates.sh docs
